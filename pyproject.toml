[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-hallucination-verification-lab"
version = "0.1.0.dev0"
description = "Claim-level factual verification and hallucination investigation for AI-generated text, with evidence traceability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-hallucination-verification-lab contributors" }]
keywords = ["llm", "evaluation", "fact-checking", "hallucination", "verification", "nlp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Core runtime is deliberately tiny: everything in Phase 1-2 runs offline
# with only Pydantic. UI and retrieval dependencies arrive as optional extras
# in later phases.
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hallab = "hallucination_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
